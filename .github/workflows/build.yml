name: Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - os: windows-latest
            artifact: metal2f0-windows
          - os: ubuntu-latest
            artifact: metal2f0-linux

    runs-on: ${{ matrix.os.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

      - name: Build application
        run: uv run pyinstaller packaging/metal2fo.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os.artifact }}
          path: dist/
