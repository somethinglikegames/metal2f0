name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - os: windows-latest
            artifact: metal2f0-windows
          - os: ubuntu-latest
            artifact: metal2f0-linux

    runs-on: ${{ matrix.os.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

      - name: Build application
        run: uv run pyinstaller packaging/metal2f0.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os.artifact }}
          path: dist/

  release:
      if: startsWith(github.ref, 'refs/tags/v')
      needs: build
      runs-on: ubuntu-latest

      steps:
        - name: Download Windows artifact
          uses: actions/download-artifact@v5
          with:
            name: metal2f0-windows
            path: release

        - name: Download Linux artifact
          uses: actions/download-artifact@v5
          with:
            name: metal2f0-linux
            path: release

        - name: Create GitHub Release
          uses: softprops/action-gh-release@v2
          with:
            generate_release_notes: true
            files: |
              release/metal2f0.exe
              release/metal2f0.x86_64